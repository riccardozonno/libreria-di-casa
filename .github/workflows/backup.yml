name: Backup

# Backup notturno (D1 + copertine → restic cifrato su Backblaze B2, 7/4/6) e controllo settimanale
# (rifiuti per limite di CPU, errori, dimensione e consumo del database). Se un job fallisce,
# GitHub manda un'email: è l'avviso automatico. Segreti e variabili: docs/backup-restore.md.

on:
  schedule:
    - cron: "30 1 * * *" # ogni notte, 02:30 (inverno) / 03:30 (estate) ora italiana
    - cron: "0 6 * * 1" # ogni lunedì mattina: controllo settimanale
  workflow_dispatch:
    inputs:
      job:
        description: "Cosa eseguire"
        type: choice
        options: [backup, controllo]
        default: backup

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: (github.event_name == 'schedule' && github.event.schedule == '30 1 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'backup')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: restic e rclone
        run: sudo apt-get update -q && sudo apt-get install -yq restic rclone && restic version && rclone version | head -1
      - name: Backup
        run: node scripts/backup/run.mjs --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RESTIC_REPOSITORY: b2:${{ vars.B2_BUCKET }}:homelibrary
          RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
          B2_ACCOUNT_ID: ${{ secrets.B2_ACCOUNT_ID }}
          B2_ACCOUNT_KEY: ${{ secrets.B2_ACCOUNT_KEY }}

  controllo:
    if: (github.event_name == 'schedule' && github.event.schedule == '0 6 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.job == 'controllo')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Controllo settimanale
        run: node scripts/backup/health.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
