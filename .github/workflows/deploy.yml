name: Deploy

# Pubblicazione in produzione, solo a mano (Actions → Deploy → Run workflow) e solo dal branch
# `main`. Prima gli stessi controlli della CI, poi migrazioni D1 e Worker. I segreti del Worker
# (GOOGLE_BOOKS_API_KEY, CF_API_TOKEN) restano su Cloudflare: la pubblicazione non li tocca.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Segnalibro di Time Travel prima delle migrazioni: per tornare a questo punto, vedi docs/produzione.md.
      - name: Punto di ripristino del database
        run: pnpm exec wrangler d1 time-travel info homelibrary
      - name: Migrazioni D1
        run: pnpm exec wrangler d1 migrations apply DB --remote
      - name: Pubblicazione del Worker
        run: pnpm exec wrangler deploy --message "GitHub Actions ${{ github.sha }}"
      - name: Controllo dopo la pubblicazione
        # Senza accesso, Access deve rispondere con il reindirizzamento al login (302), mai con i dati.
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://homelibrary.r-z030600.workers.dev/api/me)
          echo "GET /api/me senza accesso → $code"
          test "$code" = "302"
