name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # Solo per l'interpolazione di compose.yaml: il CI avvia unicamente il database di test usa e getta.
      POSTGRES_DB: ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-only
      APP_DB_PASSWORD: ci-only
      BETTER_AUTH_SECRET: ci-only-secret-ci-only-secret-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      RESTIC_PASSWORD: ci-only
      BACKUP_USB_PATH: /tmp/ci-backup
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Database di test
        run: docker compose -f compose.yaml -f compose.dev.yaml up -d --wait db-test
      - name: Test unitari e di integrazione con copertura
        run: pnpm test:coverage
      - name: Browser Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test E2E
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Build delle immagini (app e strumenti)
        run: |
          docker buildx build --target runner -t homelibrary-app:ci .
          docker buildx build --target tools -t homelibrary-tools:ci .
