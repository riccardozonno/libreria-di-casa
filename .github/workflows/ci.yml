name: CI

on:
  push:
    branches: [main, cloudflare]
  pull_request:
  # Riusata da deploy.yml: si pubblica solo dopo gli stessi controlli.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Solo variabili di sviluppo (identità finta per i test): nessun segreto.
      - run: cp .dev.vars.example .dev.vars
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test unitari e di integrazione (runtime Workers + D1 locale) con copertura
        run: pnpm test:coverage
      # I browser (~1 minuto di download) restano in cache finché non cambia la versione di Playwright;
      # --with-deps installa comunque le librerie di sistema, che non sono nella cache.
      - name: Versione di Playwright
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache dei browser Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Browser Playwright
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Test E2E (build vera, iPhone/WebKit e Android/Chromium)
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
