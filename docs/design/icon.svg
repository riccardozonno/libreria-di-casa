<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona HOME LIBRARY: quadrato pieno (iOS applica da sé gli angoli arrotondati) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F5D50"/>
      <stop offset="1" stop-color="#1B3A32"/>
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E7C8"/>
      <stop offset="1" stop-color="#E9D3A6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1A16" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <!-- tetto -->
    <path d="M512 196 L812 446 L752 446 L512 246 L272 446 L212 446 Z" fill="url(#roof)"/>
    <!-- libri sullo scaffale -->
    <rect x="300" y="470" width="78" height="300" rx="14" fill="#F6E7C8"/>
    <rect x="394" y="430" width="92" height="340" rx="14" fill="#E07A5F"/>
    <rect x="502" y="490" width="70" height="280" rx="14" fill="#F2CC8F"/>
    <g transform="rotate(14 668 770)">
      <rect x="610" y="460" width="88" height="310" rx="14" fill="#81B29A"/>
    </g>
    <!-- dettagli dei dorsi -->
    <rect x="300" y="520" width="78" height="14" fill="#1B3A32" opacity="0.18"/>
    <rect x="394" y="484" width="92" height="14" fill="#1B3A32" opacity="0.18"/>
    <rect x="394" y="712" width="92" height="14" fill="#1B3A32" opacity="0.18"/>
    <rect x="502" y="540" width="70" height="14" fill="#1B3A32" opacity="0.18"/>
    <!-- mensola -->
    <rect x="252" y="782" width="520" height="34" rx="17" fill="#F6E7C8"/>
  </g>
</svg>
