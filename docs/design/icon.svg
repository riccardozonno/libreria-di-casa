<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Icona HOME LIBRARY "Scaffale": dorsi di libri che formano il profilo di un tetto, su blu notte -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22305A"/>
      <stop offset="1" stop-color="#0E1530"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#5B7BD6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B7BD6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shelf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9C58A"/>
      <stop offset="1" stop-color="#B98A4A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- altezze crescenti verso il centro: il profilo disegna un tetto -->
    <rect x="212" y="560" width="78" height="226" rx="12" fill="#E2574C"/>
    <rect x="298" y="470" width="82" height="316" rx="12" fill="#F3A33A"/>
    <rect x="388" y="380" width="78" height="406" rx="12" fill="#F6D365"/>
    <rect x="474" y="290" width="76" height="496" rx="12" fill="#F4EEE0"/>
    <rect x="558" y="380" width="78" height="406" rx="12" fill="#4FB6A6"/>
    <rect x="644" y="470" width="82" height="316" rx="12" fill="#4A8FE0"/>
    <rect x="734" y="560" width="78" height="226" rx="12" fill="#8E6FD8"/>
    <rect x="186" y="786" width="652" height="40" rx="14" fill="url(#shelf)"/>
  </g>
  <!-- riflessi e fasce dorate sui dorsi -->
  <g fill="url(#shine)">
    <rect x="212" y="560" width="78" height="226" rx="12"/><rect x="298" y="470" width="82" height="316" rx="12"/>
    <rect x="388" y="380" width="78" height="406" rx="12"/><rect x="474" y="290" width="76" height="496" rx="12"/>
    <rect x="558" y="380" width="78" height="406" rx="12"/><rect x="644" y="470" width="82" height="316" rx="12"/>
    <rect x="734" y="560" width="78" height="226" rx="12"/>
  </g>
  <g fill="#FFFFFF" opacity="0.35">
    <rect x="212" y="600" width="78" height="10"/><rect x="298" y="510" width="82" height="10"/>
    <rect x="388" y="420" width="78" height="10"/><rect x="474" y="330" width="76" height="10"/>
    <rect x="558" y="420" width="78" height="10"/><rect x="644" y="510" width="82" height="10"/>
    <rect x="734" y="600" width="78" height="10"/>
  </g>
</svg>
