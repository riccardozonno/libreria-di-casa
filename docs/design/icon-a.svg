<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Proposta A "Aurora": casa bianca con libri colorati su sfondo blu-viola -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="0.55" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#9B4DFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.15" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF0FF"/>
    </linearGradient>
    <linearGradient id="b1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF8A7A"/><stop offset="1" stop-color="#FF5E62"/></linearGradient>
    <linearGradient id="b2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD36B"/><stop offset="1" stop-color="#FFB23F"/></linearGradient>
    <linearGradient id="b3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5EE3C1"/><stop offset="1" stop-color="#21C29B"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#2A1B7A" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#shadow)">
    <!-- casa: tetto + corpo con angoli morbidi -->
    <path d="M512 190 C528 190 543 196 555 206 L806 418 C834 442 817 488 780 488 L760 488 L760 786 C760 815 737 838 708 838 L316 838 C287 838 264 815 264 786 L264 488 L244 488 C207 488 190 442 218 418 L469 206 C481 196 496 190 512 190 Z" fill="url(#house)"/>
  </g>
  <!-- libri dentro la casa -->
  <rect x="344" y="520" width="92" height="262" rx="18" fill="url(#b1)"/>
  <rect x="456" y="470" width="104" height="312" rx="18" fill="url(#b2)"/>
  <g transform="rotate(12 640 782)">
    <rect x="586" y="530" width="90" height="252" rx="18" fill="url(#b3)"/>
  </g>
  <rect x="456" y="520" width="104" height="16" fill="#FFFFFF" opacity="0.45"/>
  <rect x="344" y="566" width="92" height="14" fill="#FFFFFF" opacity="0.4"/>
  <rect x="312" y="782" width="400" height="20" rx="10" fill="#C9CCF5"/>
</svg>
