<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Proposta B "Tramonto": libro aperto sotto un tetto, bianco su sfondo corallo-rosa -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#FFB15E"/>
      <stop offset="0.5" stop-color="#FF7A59"/>
      <stop offset="1" stop-color="#F2457A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1EA"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#8A1E3C" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g filter="url(#shadow)" fill="url(#page)">
    <!-- tetto -->
    <path d="M512 176 L812 404 C832 419 822 452 797 452 C791 452 786 450 781 446 L512 241 L243 446 C238 450 233 452 227 452 C202 452 192 419 212 404 Z"/>
    <!-- libro aperto: due pagine curve -->
    <path d="M496 532 C432 488 340 470 252 478 C236 480 224 493 224 509 L224 790 C224 808 239 822 257 820 C340 812 424 828 496 870 Z"/>
    <path d="M528 532 C592 488 684 470 772 478 C788 480 800 493 800 509 L800 790 C800 808 785 822 767 820 C684 812 600 828 528 870 Z"/>
  </g>
  <!-- righe di testo -->
  <g stroke="#FFB49B" stroke-width="16" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M292 566 C350 560 404 568 446 588"/>
    <path d="M292 630 C350 624 404 632 446 652"/>
    <path d="M292 694 C350 688 404 696 446 716"/>
    <path d="M732 566 C674 560 620 568 578 588"/>
    <path d="M732 630 C674 624 620 632 578 652"/>
    <path d="M732 694 C674 688 620 696 578 716"/>
  </g>
</svg>
